<script type="module">
/*
 * INTRUSION (v2). One procedural landscape, built by hand, then re-read by four learned paradigms.
 * Deterministic per frame: window.renderFrame(n) draws frame n and returns a JPEG data URL.
 * window.EVENTS carries bursts, typed text, chapters and shots for the soundtrack.
 *
 * Passes per frame
 *   1. scene   : ray-marched heightfield + clouds + sky (or an ink plot backdrop) -> beauty (+ sky-only for splats), depth
 *   2. vector  : JS-built lines / dots / cells, depth-tested against the scene (construction lines, signal plots)
 *   3. splats  : anisotropic Gaussians drawn back-to-front over the sky, colours sampled from the beauty pass
 *   4. post    : glitch, tonemap, grade, typography layer, grain
 */
const TL = await (await fetch("timeline.json")).json();
const W = 960, H = 540, FPS = TL.fps, FRAMES = Math.round(TL.duration * FPS);
const canvas = document.getElementById("gl");
canvas.width = W; canvas.height = H;
const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true, antialias: false, depth: false });
gl.getExtension("EXT_color_buffer_float");

// ------------------------------------------------------------------ small math
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const ramp = (t, a, b) => smooth((t - a) / (b - a));
const v3 = { add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s], dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)] };
function hashU(a, b, c) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1440662683)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function rng(seed) { let s = seed >>> 0 || 1; return () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gaussR(r) { const u = Math.max(r(), 1e-7), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

// ------------------------------------------------------------------ the world: gradient noise, by hand
// Perlin-style gradient noise on a periodic lattice. Octave k has lattice spacing 4/2^k world units.
const PER = 32, N = 1024, NOCT = 6, AMP = 1.9;
function makeOct(k, seed, s0) {
  const s = s0 / 2 ** k, p = Math.round(PER / s);
  const gx = new Float32Array(p * p), gy = new Float32Array(p * p);
  for (let j = 0; j < p; j++) for (let i = 0; i < p; i++) {
    const a = 2 * Math.PI * hashU(i, j, seed * 131 + k);
    gx[j * p + i] = Math.cos(a); gy[j * p + i] = Math.sin(a);
  }
  return { s, p, gx, gy };
}
const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
function noise(o, x, z) {
  const u = x / o.s, v = z / o.s, i0 = Math.floor(u), j0 = Math.floor(v), fu = u - i0, fv = v - j0, p = o.p;
  const i = ((i0 % p) + p) % p, j = ((j0 % p) + p) % p, i1 = (i + 1) % p, j1 = (j + 1) % p;
  const d = (ii, jj, dx, dz) => o.gx[jj * p + ii] * dx + o.gy[jj * p + ii] * dz;
  const a = d(i, j, fu, fv), b = d(i1, j, fu - 1, fv), c = d(i, j1, fu, fv - 1), e = d(i1, j1, fu - 1, fv - 1);
  const su = fade(fu), sv = fade(fv);
  return 1.4 * lerp(lerp(a, b, su), lerp(c, e, su), sv);
}
const OCT = [...Array(NOCT)].map((_, k) => makeOct(k, 11, 4));
const COCT = [...Array(NOCT)].map((_, k) => makeOct(k, 97, 8));
const texA = new Float32Array(N * N * 4), texB = new Float32Array(N * N * 4), HF = new Float32Array(N * N);
let HMIN = 1e9, HMAX = -1e9;
for (let iz = 0; iz < N; iz++) for (let ix = 0; ix < N; ix++) {
  const x = ((ix + 0.5) * PER) / N, z = ((iz + 0.5) * PER) / N, q = (iz * N + ix) * 4;
  let raw = 0, cl = 0;
  for (let k = 0; k < NOCT; k++) {
    const n = noise(OCT[k], x, z);
    raw += n * 0.5 ** k;
    if (k < 4) texA[q + k] = n; else texB[q + k - 4] = n;
    cl += noise(COCT[k], x, z) * 0.5 ** k;
  }
  const h = AMP * raw;
  texB[q + 2] = cl / 1.97; texB[q + 3] = h; HF[iz * N + ix] = h;
  HMIN = Math.min(HMIN, h); HMAX = Math.max(HMAX, h);
}
// CPU sampler that matches GL_LINEAR on texel centres with REPEAT wrap
function hAt(x, z) {
  const u = (x / PER) * N - 0.5, v = (z / PER) * N - 0.5, i0 = Math.floor(u), j0 = Math.floor(v), fu = u - i0, fv = v - j0;
  const w = (a) => ((a % N) + N) % N, i = w(i0), j = w(j0), i1 = w(i0 + 1), j1 = w(j0 + 1);
  return lerp(lerp(HF[j * N + i], HF[j * N + i1], fu), lerp(HF[j1 * N + i], HF[j1 * N + i1], fu), fv);
}
function nAt(x, z) { const e = 0.04; return v3.norm([hAt(x - e, z) - hAt(x + e, z), 2 * e, hAt(x, z - e) - hAt(x, z + e)]); }
function castRay(o, d, tmax = 70) {
  let t = 0.02, lt = t;
  for (let i = 0; i < 900; i++) {
    const p = v3.add(o, v3.mul(d, t)), dy = p[1] - hAt(p[0], p[2]);
    if (dy < 0) { let a = lt, b = t; for (let k = 0; k < 20; k++) { const m = (a + b) / 2, q = v3.add(o, v3.mul(d, m)); if (q[1] - hAt(q[0], q[2]) < 0) b = m; else a = m; } return (a + b) / 2; }
    if (t > tmax || (p[1] > HMAX + 0.1 && d[1] > 0)) return null;
    lt = t; t += Math.max(0.01, dy * 0.3);
  }
  return null;
}

// ------------------------------------------------------------------ camera
const FOC = 1.5, NEAR = 0.05, FAR = 200;
function cam(pos, yaw, pitch) {
  const cp = Math.cos(pitch), f = [Math.sin(yaw) * cp, Math.sin(pitch), Math.cos(yaw) * cp];
  const r = [-Math.cos(yaw), 0, Math.sin(yaw)], u = v3.cross(r, f);
  return { pos, f, r, u, yaw, pitch };
}
function look(pos, tgt) { const d = v3.sub(tgt, pos); return cam(pos, Math.atan2(d[0], d[2]), Math.atan2(d[1], Math.hypot(d[0], d[2]))); }
function camLerp(a, b, k) { return cam(v3.lerp(a.pos, b.pos, k), lerp(a.yaw, b.yaw, k), lerp(a.pitch, b.pitch, k)); }
function proj(c, X) {
  const v = v3.sub(X, c.pos), zv = v3.dot(v, c.f);
  if (zv < NEAR) return null;
  const sx = (v3.dot(v, c.r) / zv) * FOC, sy = (v3.dot(v, c.u) / zv) * FOC;
  return { x: W / 2 + sx * H, y: H / 2 - sy * H, z: (FAR + NEAR) / (FAR - NEAR) - (2 * FAR * NEAR) / ((FAR - NEAR) * zv), zv };
}
function pixelRay(c, px, py) { const x = (px - W / 2) / H, y = (H / 2 - py) / H; return v3.norm(v3.add(v3.mul(c.f, FOC), v3.add(v3.mul(c.r, x), v3.mul(c.u, y)))); }

// ------------------------------------------------------------------ GL helpers
const VS_FULL = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p*.5+.5; gl_Position = vec4(p,0,1); }`;
function program(vs, fs, attribs) {
  const p = gl.createProgram();
  for (const [t, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  attribs.forEach((a, i) => gl.bindAttribLocation(p, i, a));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const cache = {};
  p.u = (n) => (n in cache ? cache[n] : (cache[n] = gl.getUniformLocation(p, n)));
  return p;
}
function makeTex(w, h, ifmt, fmt, type, data, { filter = gl.LINEAR, wrap = gl.CLAMP_TO_EDGE, mip = false } = {}) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, data ?? null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  if (mip) gl.generateMipmap(gl.TEXTURE_2D);
  return t;
}
const tA = makeTex(N, N, gl.RGBA16F, gl.RGBA, gl.FLOAT, texA, { wrap: gl.REPEAT });
const tB = makeTex(N, N, gl.RGBA16F, gl.RGBA, gl.FLOAT, texB, { wrap: gl.REPEAT, mip: true });
const LN = 64, latData = new Float32Array(LN * LN * 4);
const tL = makeTex(LN, LN, gl.RGBA16F, gl.RGBA, gl.FLOAT, latData, { wrap: gl.REPEAT });
const beautyTex = makeTex(W, H, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT);
const skyTex = makeTex(W, H, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT);
const txtTex = makeTex(W, H, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE);
const depthRB = gl.createRenderbuffer();
gl.bindRenderbuffer(gl.RENDERBUFFER, depthRB); gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, W, H);
const fboScene = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, fboScene);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, beautyTex, 0);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, skyTex, 0);
gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depthRB);
const fboSplat = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, fboSplat);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, skyTex, 0);
gl.bindFramebuffer(gl.FRAMEBUFFER, null);

// ------------------------------------------------------------------ scene shader
const HEAD = `#version 300 es
precision highp float;
precision highp sampler2D;
#define PI 3.14159265359
#define TAU 6.28318530718
float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
float h13(vec3 p3){ p3 = fract(p3*.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y)*p3.z); }
`;
const SCENE = HEAD + `
in vec2 uv;
layout(location = 0) out vec4 o0;
layout(location = 1) out vec4 o1;
uniform vec2 R; uniform float T;
uniform vec3 RO, CF, CR, CU;
uniform sampler2D tA, tB, tL;
uniform vec4 wA; uniform vec2 wB;
uniform float DSKY, BUILD, HS, HMAX, INK, CLAY, TOPO, SUNE, SUNA, CLOUD, LAT, MC, CACHE, STEP, ROUGH, SPEC, NEU, WIRE, CLUS, LOSS, SPL, FRAME;
uniform vec3 LATOFF;
const float PER = ${PER.toFixed(1)}, AMP = ${AMP.toFixed(3)}, FOC = ${FOC.toFixed(3)}, NEAR = ${NEAR}, FAR = ${FAR.toFixed(1)};
const float CB = 8.6, CT = 10.4;
vec3 SD;

float hfull(vec2 p){ return textureLod(tB, p/PER, 0.).a; }
float hgt(vec2 p){
  vec2 u = p/PER;
  if(BUILD > .5) return HS*AMP*(dot(textureLod(tA, u, 0.), wA) + dot(textureLod(tB, u, 0.).xy, wB));
  float h = textureLod(tB, u, 0.).a;
  if(LAT > 0.){
    vec2 q = (p + LATOFF.xy)/PER;
    float det = textureLod(tB, q, 0.).a - textureLod(tB, q, 4.).a;
    float nearest = texelFetch(tL, ivec2(mod(floor(u*64.), 64.)), 0).r;
    float smoothH = textureLod(tL, u, 0.).r + det*LATOFF.z;
    h = mix(h, mix(nearest, smoothH, LATOFF.z), LAT);
  }
  return h;
}
float march(vec3 ro, vec3 rd, out bool hit){
  hit = false;
  float top = HMAX + .05, t = NEAR;
  if(ro.y > top){ if(rd.y >= 0.) return FAR; t = max(t, (ro.y - top)/-rd.y); }
  float lt = t;
  for(int i = 0; i < 190; i++){
    vec3 p = ro + rd*t;
    float d = p.y - hgt(p.xz);
    if(d < 0.){ hit = true; break; }
    if(t > 90. || (p.y > top && rd.y > 0.)) break;
    lt = t;
    t += LAT > 0. ? clamp(d*.42, .0025*t + .002, .18) : max(d*.42, .0025*t + .002);
  }
  if(!hit) return FAR;
  float a = lt, b = t;
  for(int i = 0; i < 6; i++){ float m = .5*(a + b); vec3 p = ro + rd*m; if(p.y - hgt(p.xz) < 0.) b = m; else a = m; }
  return .5*(a + b);
}
vec3 nrm(vec2 p, float t){
  float e = max(.02, .0012*t);
  return normalize(vec3(hgt(p - vec2(e, 0)) - hgt(p + vec2(e, 0)), 2.*e, hgt(p - vec2(0, e)) - hgt(p + vec2(0, e))));
}
// value noise with analytic derivatives, used only for close-up rock detail
vec3 vn2(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*f*(f*(f*6. - 15.) + 10.), du = 30.*f*f*(f*(f - 2.) + 1.);
  float a = h12(i), b = h12(i + vec2(1, 0)), c = h12(i + vec2(0, 1)), d = h12(i + vec2(1, 1));
  float k1 = b - a, k2 = c - a, k4 = a - b - c + d;
  return vec3(a + k1*u.x + k2*u.y + k4*u.x*u.y, du*vec2(k1 + k4*u.y, k2 + k4*u.x));
}
float shadow(vec3 p){
  if(SD.y < -.02) return 0.;
  float res = 1., t = .04;
  for(int i = 0; i < 28; i++){
    vec3 q = p + SD*t;
    if(q.y > HMAX + .05) break;
    float d = q.y - hgt(q.xz);
    res = min(res, 10.*d/t);
    if(res < .01) break;
    t += clamp(d*.5, .03, .7);
  }
  return clamp(res, 0., 1.);
}
float cloudCov(){ return mix(.75, .06, CLOUD); }
float cloudD(vec3 p){
  float f = textureLod(tB, (p.xz + vec2(T*.18, T*.05))/PER, 0.).b;
  float hh = (p.y - CB)/(CT - CB);
  return clamp((f - cloudCov())*4. - abs(hh - .38)*2.2, 0., 1.);
}
float day(){ return smoothstep(-.14, .12, SUNE); }
vec3 sunCol(){ return mix(vec3(3.0, 1.55, .72), vec3(3.2, 2.5, 1.8), smoothstep(.1, .6, SUNE))*smoothstep(-.05, .05, SUNE); }
vec3 ambCol(){ return mix(vec3(.03, .04, .08), vec3(.10, .145, .25), day()); }
vec3 sky(vec3 rd){
  float dy = day();
  vec3 zen = mix(vec3(.006, .009, .02), vec3(.035, .075, .2), dy);
  vec3 hor = mix(vec3(.03, .035, .06), vec3(.66, .45, .33), dy);
  float h = max(rd.y, 0.);
  vec3 c = mix(hor, zen, pow(h, .42));
  float mu = max(dot(rd, SD), 0.);
  c += vec3(1., .5, .22)*pow(mu, 6.)*.55*dy + vec3(1., .72, .45)*pow(mu, 60.)*.7*dy;
  c = mix(c, hor*.55, smoothstep(0., -.08, rd.y));
  return c;
}
vec4 clouds(vec3 ro, vec3 rd, float tlim){
  if(CLOUD <= 0.) return vec4(0, 0, 0, 1);
  float ta, tb;
  if(abs(rd.y) < 1e-3) return vec4(0, 0, 0, 1);
  ta = (CB - ro.y)/rd.y; tb = (CT - ro.y)/rd.y;
  if(ta > tb){ float s = ta; ta = tb; tb = s; }
  ta = max(ta, 0.); tb = min(tb, min(tlim, ta + 14.));
  if(tb <= ta) return vec4(0, 0, 0, 1);
  float dt = (tb - ta)/8., tr = 1.;
  vec3 acc = vec3(0);
  float j = h12(gl_FragCoord.xy + fract(T)*91.);
  vec3 sc = sunCol(), am = ambCol();
  float mu = dot(rd, SD), ph = .6 + .9*pow(max(mu, 0.), 6.);
  for(int i = 0; i < 8; i++){
    vec3 p = ro + rd*(ta + (float(i) + j)*dt);
    float d = cloudD(p);
    if(d > .01){
      float l = exp(-cloudD(p + SD*.7)*3.2);
      float a = 1. - exp(-d*dt*1.6);
      acc += tr*a*(sc*l*ph*.8 + am*1.1 + vec3(.015));
      tr *= 1. - a;

  return vec4(acc*fadeD, mix(1., tr, fadeD));
}
float cloudShadow(vec3 p){
  if(CLOUD <= 0. || SD.y < .02) return 1.;
  vec3 q = p + SD*((CB + .7 - p.y)/SD.y);
  return mix(1., exp(-cloudD(q)*2.4), .85);
}
vec3 sunDisk(vec3 rd){ float mu = max(dot(rd, SD), 0.); return (vec3(18., 12., 7.)*smoothstep(.99955, .9998, mu) + vec3(1., .55, .28)*pow(mu, 700.)*2.5)*smoothstep(-.03, .01, SUNE); }
vec3 skyWithClouds(vec3 ro, vec3 rd){
  vec3 s = sky(rd);

  return s*c.a + c.rgb + sunDisk(rd)*mix(.25, 1., c.a);
}
// Cook-Torrance 1981: Rs = F/pi * D G / ((N.L)(N.V)), Beckmann D with rms slope m
float ctSpec(vec3 n, vec3 v, vec3 l, float m, float F0){
  vec3 h = normalize(v + l);
  float nl = max(dot(n, l), 0.), nv = max(dot(n, v), 1e-3), nh = max(dot(n, h), 1e-3), vh = max(dot(v, h), 1e-3);
  float c2 = nh*nh, t2 = (1. - c2)/c2;
  float D = exp(-t2/(m*m))/(m*m*c2*c2);
  float G = min(1., min(2.*nh*nv/vh, 2.*nh*nl/vh));
  float F = F0 + (1. - F0)*pow(1. - vh, 5.);
  return F/PI*D*G/(nl*nv + 1e-4);
}
vec3 albedo(vec3 p, vec3 n){
  vec2 u = p.xz/PER;
  float mot = textureLod(tA, u*4., 0.).w;
  float slope = 1. - n.y;
  vec3 a = mix(vec3(.055, .07, .045), vec3(.15, .125, .095), smoothstep(.06, .2, slope + mot*.06 + (p.y + .5)*.05));
  a = mix(a, vec3(.25, .24, .23)*(.85 + .3*mot), smoothstep(.2, .4, slope + mot*.05));
  a = mix(a, vec3(.8, .8, .79), smoothstep(1.05, 1.5, p.y + mot*.12)*smoothstep(.5, .3, slope));
  return a;
}
float ndcDepth(float zv){ return .5*((FAR + NEAR)/(FAR - NEAR) - 2.*FAR*NEAR/((FAR - NEAR)*zv)) + .5; }

vec3 hot = vec3(1., .027, .12), cyan = vec3(.02, .8, 1.), paper = vec3(.83, .82, .78);

void main(){
  vec2 f = uv*R, p = (f - .5*R)/R.y;
  float sn = cos(SUNE);

    });

  // instrument backing while the signal owns a world shot
  if (breached && !signal) { cx.fillStyle = "rgba(6,6,8,.6)"; cx.fillRect(W - M - 336, 42, 342, 34); }
  // shot labels
  cx.textAlign = "left";
  for (const fn of LAB) fn();
  cx.textAlign = "left";
  // shout
  const st = t - c.shoutAt;
  if (st > 0 && st < 1.6 && Math.floor(st * 12) % 7 !== 0) {
    cx.fillStyle = "rgba(6,6,8,.78)"; cx.fillRect(0, H / 2 - 46, W, 92);
    cx.font = "900 30px Unbounded, sans-serif"; cx.textAlign = "center"; cx.fillStyle = HOT;
    c.shout.forEach((line, i) => cx.fillText(scramble(line, burst * 0.25, r), W / 2 + (r() - 0.5) * 10 * burst, H / 2 - 8 + i * 38));
    cx.textAlign = "left";
  }
}
function drawOutro(t, frame) {
  cx.textAlign = "center";
  if (t < OUT.card) {
    const fade = 1 - smooth((t - (OUT.collapse - 0.2)) / 0.7);
    cx.globalAlpha = fade;
    cx.font = SERIF(40, true);
    TYPED.filter((e) => e.scene === 5 && t >= e.t).forEach((e, i) => { cx.fillStyle = i === 2 ? HOT : PAPER; cx.fillText(typed(e, t), W / 2, H / 2 - 40 + i * 48); });
    cx.globalAlpha = 1;
    cx.font = MONO(11); cx.fillStyle = HOT; cx.textAlign = "right"; cx.fillText(`● ${tcode(t)}`, W - 34, 34);
  } else {
    cx.font = MONO(12); cx.fillStyle = DIM; cx.fillText("NOTE 01 — INTRUSION", W / 2, H / 2 - 30);
    cx.font = "900 44px Unbounded, sans-serif"; cx.fillStyle = PAPER; cx.fillText("SkinkEBravia", W / 2, H / 2 + 22);
  }
  cx.textAlign = "left";
}

// ------------------------------------------------------------------ render
function render(frame) {
  const t = frame / FPS;
  const burst = burstAt(t);
  VA.reset(); VX.reset(); LAB.length = 0; splN = 0;
  const U = defaults();
  let c = null;
  const ch = chapterAt(t);
  if (t < TL.boot.end) {
    U.INK = 1; U.ARCH = 0; U.SCRIM = 0;
    const k = ramp(t, TL.boot.end - 0.35, TL.boot.end - 0.05);
    if (k > 0) { VX.seg(W / 2 - 480 * k, H / 2, W / 2 + 480 * k, H / 2, 1 + 3 * k, ca(COL.paper, 0.9)); }
    U.FLASH = ramp(t, TL.boot.end - 0.08, TL.boot.end) * 0.6;
  } else if (ch) {
    const s = shotAt(ch, t);
    CAM = null;
    // camera first so vector geometry can project
    const pre = s.kind === "splats" || s.kind === "sig-loss" ? wideCam(t) : s.kind === "latent" ? dawnCam(t) : s.kind === "paths" || s.kind === "cache" ? valCam(t) : s.kind === "lobe" || s.kind === "neural" ? rockCam(t) : s.kind === "lattice" ? topCam(18.5 - (t - s.start) * 0.4) : s.kind === "octaves" ? topCam(17.74 - (t - s.start) * 0.5) : null;
    CAM = pre;
    c = SH[s.kind](t, t - s.start, U) ?? null;
    if (c && !pre) CAM = c;
  } else {
    // outro: the splat world dims, then collapses back into one Gaussian
    U.SPL = 1; U.ARCH = 0.3; U.SIG = 0.5; U.SCRIM = 0.6;
    if (t < OUT.card) {
      c = wideCam(t); CAM = c;
      buildSplats(c, 1, ramp(t, OUT.collapse, OUT.card - 0.1));
      U.FADE = 0.45 * ramp(t, OUT.start, OUT.start + 1.2) * (1 - ramp(t, OUT.collapse, OUT.collapse + 0.6) * 0.4);
    } else { U.INK = 1; U.SPL = 0; U.ARCH = 0; U.SCRIM = 0; U.FADE = 0; }
  }
  if (!c) c = DAWN0;

  // typography
  cx.clearRect(0, 0, W, H);
  drawHUD(t, frame, burst);
  cx.shadowBlur = 0;
  gl.bindTexture(gl.TEXTURE_2D, txtTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tc);

  // 1. scene
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboScene);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  gl.viewport(0, 0, W, H);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.ALWAYS); gl.depthMask(true);
  gl.useProgram(sceneProg);
  const P = sceneProg;
  gl.uniform2f(P.u("R"), W, H); gl.uniform1f(P.u("T"), t); gl.uniform1f(P.u("FRAME"), frame);
  gl.uniform3fv(P.u("RO"), c.pos); gl.uniform3fv(P.u("CF"), c.f); gl.uniform3fv(P.u("CR"), c.r); gl.uniform3fv(P.u("CU"), c.u);
  gl.uniform4fv(P.u("wA"), U.wA); gl.uniform2fv(P.u("wB"), U.wB); gl.uniform3fv(P.u("LATOFF"), U.LATOFF);
  for (const k of ["DSKY", "BUILD", "HS", "INK", "CLAY", "TOPO", "SUNE", "CLOUD", "LAT", "MC", "CACHE", "STEP", "ROUGH", "SPEC", "NEU", "WIRE", "CLUS", "LOSS", "SPL"]) gl.uniform1f(P.u(k), U[k]);
  gl.uniform1f(P.u("SUNA"), SUNA);
  gl.uniform1f(P.u("HMAX"), U.LAT > 0 ? HMAX + 0.3 : HMAX);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tA); gl.uniform1i(P.u("tA"), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tB); gl.uniform1i(P.u("tB"), 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, tL); gl.uniform1i(P.u("tL"), 2);
  fullTri();
  // 2. vector layer, depth-tested against the scene
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.NONE]);
  gl.depthFunc(gl.LEQUAL); gl.depthMask(false);
  drawBatch(VA, false); drawBatch(VX, true);
  gl.disable(gl.DEPTH_TEST); gl.depthMask(true);
  // 3. splats over the sky
  if (U.SPL) drawSplats();
  // 4. post
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.useProgram(postProg);
  const Q = postProg;
  gl.uniform2f(Q.u("R"), W, H); gl.uniform1f(Q.u("T"), t); gl.uniform1f(Q.u("B"), burst); gl.uniform1f(Q.u("S"), Math.floor(frame / 2) + 0.5);
  for (const k of ["SIG", "ARCH", "FADE", "SCRIM", "FLASH"]) gl.uniform1f(Q.u(k), U[k]);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, U.SPL ? skyTex : beautyTex); gl.uniform1i(Q.u("SRC"), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, txtTex); gl.uniform1i(Q.u("TXT"), 1);
  fullTri();
  gl.activeTexture(gl.TEXTURE0);
}

window.renderFrame = (f) => { render(f); gl.finish(); return canvas.toDataURL("image/jpeg", 0.95); };
await Promise.all(["900 20px Unbounded", "400 20px Serif", "italic 400 20px Serif", "500 12px Mono"].map((f) => document.fonts.load(f)));
await document.fonts.load("500 12px Mono", "αω∇");
window.INFO = { HMIN, HMAX };
window.ready = true;
if (!location.search.includes("capture")) {
  const t0 = performance.now();
  const loop = () => { render(Math.floor(((performance.now() - t0) / 1000) * FPS) % FRAMES); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
