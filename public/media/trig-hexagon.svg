<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 50 340 300" width="340" height="300" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">
  <title>Trigonometric identity hexagon</title>
  <desc>A regular hexagon with 1 in the centre. Top row: sin, cos. Middle row: tan, 1, cot. Bottom row: sec, csc. Three shaded downward-pointing triangles, (sin, cos, 1), (tan, 1, sec) and (1, cot, csc), give the three Pythagorean identities.</desc>
  <style>
    .edge  { stroke: #ecebe6; stroke-opacity: 0.55; stroke-width: 1.5; fill: none; }
    .tri   { fill: #27e6ff; fill-opacity: 0.16; stroke: #27e6ff; stroke-width: 1.5; stroke-linejoin: round; }
    .node  { fill: #15151b; stroke: #ecebe6; stroke-width: 1.5; }
    .one   { fill: #15151b; stroke: #d4ff3a; stroke-width: 2; }
    .label { fill: #ecebe6; font-size: 22px; font-style: italic; text-anchor: middle; dominant-baseline: central; }
    .big   { fill: #d4ff3a; font-size: 26px; font-style: normal; }
  </style>

  <rect x="30" y="50" width="340" height="300" fill="#0c0c10"/>

  <!-- shaded triangles: two top corners, one bottom corner -->
  <polygon class="tri" points="135,87.4 265,87.4 200,200"/>
  <polygon class="tri" points="70,200 200,200 135,312.6"/>
  <polygon class="tri" points="200,200 330,200 265,312.6"/>

  <polygon class="edge" points="135,87.4 265,87.4 330,200 265,312.6 135,312.6 70,200"/>

  <circle class="node" cx="135" cy="87.4"  r="26"/><text class="label" x="135" y="87.4">sin</text>
  <circle class="node" cx="265" cy="87.4"  r="26"/><text class="label" x="265" y="87.4">cos</text>
  <circle class="node" cx="70"  cy="200"   r="26"/><text class="label" x="70"  y="200">tan</text>
  <circle class="node" cx="330" cy="200"   r="26"/><text class="label" x="330" y="200">cot</text>
  <circle class="node" cx="135" cy="312.6" r="26"/><text class="label" x="135" y="312.6">sec</text>
  <circle class="node" cx="265" cy="312.6" r="26"/><text class="label" x="265" y="312.6">csc</text>

  <circle class="one" cx="200" cy="200" r="26"/><text class="label big" x="200" y="200">1</text>
</svg>
